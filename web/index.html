<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Matches - xBiteTV</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    main { width: min(840px, calc(100% - 32px)); margin: 36px auto; }
    h1 { font-size: 1.8rem; margin: 0 0 20px; }
    #games-list { display: grid; gap: 12px; }
    .game-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px; background: #1f2937; border-radius: 10px; }
    .game-info { min-width: 0; }
    .game-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
    .game-status { color: #9ca3af; }
    .watch-button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    .watch-button:hover { background: #1d4ed8; }
    .watch-button[disabled] { opacity: 0.5; cursor: not-allowed; }
    .empty { color: #9ca3af; padding: 12px 0; }
    .error { color: #fca5a5; }
    #status { min-height: 1.5em; margin-top: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <main>
    <h1>Live Matches</h1>
    <section id="games-list" aria-live="polite"></section>
    <p id="status" role="status"></p>
  </main>
  <script>
    const gameList = document.querySelector('#games-list');
    const status = document.querySelector('#status');

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function getMatchLink(game) {
      return game.link || game.url || game.match_url || '';
    }

    function renderGames(games) {
      gameList.replaceChildren();

      if (!games.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No matches available right now.';
        gameList.appendChild(empty);
        return;
      }

      games.forEach(game => {
        const row = document.createElement('div');
        row.className = 'game-item';

        const info = document.createElement('div');
        info.className = 'game-info';

        const name = document.createElement('div');
        name.className = 'game-name';
        name.textContent = game.match_name || 'Unknown match';

        const gameStatus = document.createElement('div');
        gameStatus.className = 'game-status';
        gameStatus.textContent = game.status || 'Unknown status';

        info.append(name, gameStatus);

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'watch-button';

        const matchUrl = getMatchLink(game);
        const isStarted = String(game.status || '').trim().toLowerCase() === 'started';
        if (!isStarted || !matchUrl) {
          button.disabled = true;
          button.textContent = isStarted ? 'Watch' : (game.status || 'Waiting');
        } else {
          button.textContent = 'Watch';
          button.addEventListener('click', () => {
            window.location.href = '/game.html?url=' + encodeURIComponent(matchUrl);
          });
        }

        row.append(info, button);
        gameList.appendChild(row);
      });
    }

    async function loadGames() {
      try {
        const response = await fetch('/games');
        const data = await response.text();
        let games = [];
        try {
          games = data ? JSON.parse(data) : [];
        } catch {
          throw new Error('Invalid JSON returned by /games.');
        }

        if (!response.ok) {
          const error = Array.isArray(games) ? 'Unable to load matches.' : (games.error || 'Unable to load matches.');
          throw new Error(error);
        }

        renderGames(Array.isArray(games) ? games : []);
        setStatus('Loaded ' + games.length + ' match(es).');
      } catch (error) {
        setStatus(error.message || 'Failed to load matches.', true);
      }
    }

    loadGames();
  </script>
</body>
</html>
