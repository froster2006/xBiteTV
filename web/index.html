<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xBiteTV</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    main { width: min(1120px, calc(100% - 32px)); margin: 36px auto; }
    h1 { font-size: 1.8rem; margin: 0 0 20px; }
    #games-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .source-panel { min-width: 0; padding: 12px; border: 1px solid #374151; border-radius: 10px; background: #17212f; }
    .source-title { margin: 0 0 10px; color: #d1d5db; font-size: 0.9rem; font-weight: 700; }
    .source-games { display: grid; gap: 8px; }
    .game-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px; background: #1f2937; border-radius: 10px; }
    .game-info { min-width: 0; }
    .game-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
    .game-status { color: #9ca3af; }
    .watch-button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    .watch-button:hover { background: #1d4ed8; }
    .watch-button[disabled] { opacity: 0.5; cursor: not-allowed; }
    .empty { color: #9ca3af; padding: 12px 0; }
    .error { color: #fca5a5; }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17, 24, 39, 0.72);
      z-index: 1000;
    }
    #loading-overlay[hidden] { display: none; }
    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 28px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(148, 163, 184, 0.3);
      border-top-color: #f8fafc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { min-height: 1.5em; margin-top: 12px; color: #9ca3af; }
    #status:empty { display: none; }
    @media (max-width: 680px) {
      #games-list { grid-template-columns: minmax(0, 1fr); }
      .source-panel { grid-column: 1 !important; grid-row: auto !important; }
    }
  </style>
</head>
<body>
  <div id="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <div>Loading matches...</div>
    </div>
  </div>
  <main>
    <h1>xBiteTV</h1>
    <section id="games-list" aria-live="polite"></section>
    <p id="status" role="status"></p>
  </main>
  <script>
    const gameList = document.querySelector('#games-list');
    const status = document.querySelector('#status');
    const loadingOverlay = document.querySelector('#loading-overlay');

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function getMatchLink(game) {
      return game.link || game.url || game.match_url || '';
    }

    function setLoading(isLoading) {
      loadingOverlay.hidden = !isLoading;
    }

    function renderGames(games) {
      gameList.replaceChildren();

      if (!games.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No matches available right now.';
        gameList.appendChild(empty);
        return;
      }

      const groups = new Map();
      games.forEach(game => {
        const source = game.source_prefix || game.source_web || 'Other';
        if (!groups.has(source)) groups.set(source, []);
        groups.get(source).push(game);
      });

      [...groups.entries()].forEach(([source, sourceGames], sourceIndex) => {
        const panel = document.createElement('section');
        panel.className = 'source-panel';
        panel.style.gridColumn = String((sourceIndex % 2) + 1);
        panel.style.gridRow = String(Math.floor(sourceIndex / 2) + 1);

        const title = document.createElement('h2');
        title.className = 'source-title';
        title.textContent = source;

        const rows = document.createElement('div');
        rows.className = 'source-games';

        sourceGames.forEach(game => {
          const row = document.createElement('div');
          row.className = 'game-item';

          const info = document.createElement('div');
          info.className = 'game-info';

          const name = document.createElement('div');
          name.className = 'game-name';
          name.textContent = game.match_name || 'Unknown match';

          const gameStatus = document.createElement('div');
          gameStatus.className = 'game-status';
          gameStatus.textContent = game.status || 'Unknown status';

          info.append(name, gameStatus);

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'watch-button';

          const matchUrl = getMatchLink(game);
          const isStarted = String(game.status || '').trim().toLowerCase() === 'started';
          if (!isStarted || !matchUrl) {
            button.disabled = true;
            button.textContent = isStarted ? 'Watch' : (game.status || 'Waiting');
          } else {
            button.textContent = 'Watch';
            button.addEventListener('click', () => {
              window.location.href = '/game.html?url=' + encodeURIComponent(matchUrl);
            });
          }

          row.append(info, button);
          rows.appendChild(row);
        });

        panel.append(title, rows);
        gameList.appendChild(panel);
      });
    }

    async function loadGames() {
      setLoading(true);
      try {
        const response = await fetch('/games');
        const data = await response.text();
        let games = [];
        try {
          games = data ? JSON.parse(data) : [];
        } catch {
          throw new Error('Invalid JSON returned by /games.');
        }

        if (!response.ok) {
          const error = Array.isArray(games) ? 'Unable to load matches.' : (games.error || 'Unable to load matches.');
          throw new Error(error);
        }

        renderGames(Array.isArray(games) ? games : []);
      } catch (error) {
        setStatus(error.message || 'Failed to load matches.', true);
      } finally {
        setLoading(false);
      }
    }

    loadGames();
  </script>
</body>
</html>
