<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xBiteTV</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", sans-serif;
      --background: #101722;
      --surface: #1c2837;
      --surface-hover: #26364a;
      --line: #394a60;
      --text: #edf2f7;
      --muted: #a9b5c5;
      --accent: #d7f36a;
      --accent-text: #19200e;
      --alert: #ff8875;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background-color: var(--background);
      background-image: linear-gradient(128deg, #071a34 0%, #17326f 48%, #9428e8 100%);
      background-attachment: fixed;
    }
    main { width: min(94vw, 1720px); margin: 48px auto 64px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 38px; }
    h1 { margin: 0; font-size: 2.5rem; line-height: 1; font-weight: 700; }
    #refresh-button {
      min-height: 54px;
      padding: 0 22px;
      border: 0;
      border-radius: 5px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease;
    }
    #refresh-button:hover:not(:disabled) { background: #e5ff83; transform: translateY(-1px); }
    #refresh-button:disabled { opacity: 0.6; cursor: wait; }
    #games-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 34px 28px; }
    .source-panel { min-width: 0; padding: 16px 0 0; border: 0; border-top: 2px solid var(--line); }
    .source-title { margin: 0 0 14px; color: var(--accent); font-size: 1rem; font-weight: 700; }
    .source-games { display: grid; gap: 8px; }
    .game-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 88px;
      padding: 15px 16px;
      border-left: 3px solid transparent;
      border-radius: 4px;
      background: var(--surface);
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .game-item:focus-within { border-left-color: var(--accent); background: var(--surface-hover); }
    .game-info { min-width: 0; }
    .game-name { margin-bottom: 7px; font-size: 1.25rem; line-height: 1.2; font-weight: 700; overflow-wrap: anywhere; }
    .game-status { color: var(--muted); font-size: 1rem; }
    .watch-button {
      flex: 0 0 auto;
      min-width: 106px;
      min-height: 50px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease;
    }
    .watch-button:hover:not(:disabled) { background: #e5ff83; transform: translateY(-1px); }
    .watch-button[disabled] { border-color: var(--line); background: #263242; color: var(--muted); cursor: not-allowed; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .empty { grid-column: 1 / -1; color: var(--muted); padding: 24px 0; font-size: 1.2rem; }
    .error { color: var(--alert); }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 20, 0.84);
      z-index: 1000;
    }
    #loading-overlay[hidden] { display: none; }
    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 30px 38px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 1.2rem;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { min-height: 1.5em; margin-top: 20px; color: var(--muted); font-size: 1rem; }
    #status:empty { display: none; }
    @media (max-width: 1280px) {
      #games-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      main { width: min(92vw, 560px); margin: 28px auto 40px; }
      .page-header { align-items: flex-start; margin-bottom: 28px; }
      h1 { font-size: 2rem; }
      #refresh-button { min-height: 48px; padding: 0 14px; font-size: 0.95rem; }
      #games-list { grid-template-columns: minmax(0, 1fr); }
      #games-list .source-panel { grid-column: 1; grid-row: auto; }
      .game-item { gap: 10px; padding: 12px; }
      .game-name { font-size: 1.1rem; }
      .watch-button { min-width: 88px; min-height: 46px; padding: 0 12px; }
    }
  </style>
</head>
<body>
  <div id="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <div>Loading matches...</div>
    </div>
  </div>
  <main>
    <header class="page-header">
      <h1>xBiteTV</h1>
      <button id="refresh-button" type="button">Refresh matches</button>
    </header>
    <section id="games-list" aria-live="polite"></section>
    <p id="status" role="status"></p>
  </main>
  <script>
    const gameList = document.querySelector('#games-list');
    const status = document.querySelector('#status');
    const loadingOverlay = document.querySelector('#loading-overlay');
    const refreshButton = document.querySelector('#refresh-button');
    const GAMES_CACHE_KEY = 'xbiteTV.games.v1';
    const GAMES_CACHE_TTL_MS = 30 * 60 * 1000;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function getMatchLink(game) {
      return game.link || game.url || game.match_url || '';
    }

    function setLoading(isLoading) {
      loadingOverlay.hidden = !isLoading;
      refreshButton.disabled = isLoading;
    }

    function readGamesCache() {
      try {
        const cached = JSON.parse(localStorage.getItem(GAMES_CACHE_KEY));
        if (!cached || !Array.isArray(cached.games) || !Number.isFinite(cached.savedAt)) {
          localStorage.removeItem(GAMES_CACHE_KEY);
          return null;
        }
        if (Date.now() - cached.savedAt >= GAMES_CACHE_TTL_MS || cached.savedAt > Date.now()) {
          localStorage.removeItem(GAMES_CACHE_KEY);
          return null;
        }
        return cached.games;
      } catch {
        return null;
      }
    }

    function writeGamesCache(games) {
      try {
        localStorage.setItem(GAMES_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), games }));
      } catch {
        // Storage may be disabled or full; continue without caching.
      }
    }

    function renderGames(games) {
      gameList.replaceChildren();

      if (!games.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No matches available right now.';
        gameList.appendChild(empty);
        return;
      }

      const groups = new Map();
      games.forEach(game => {
        const source = game.source_prefix || game.source_web || 'Other';
        if (!groups.has(source)) groups.set(source, []);
        groups.get(source).push(game);
      });

      [...groups.entries()].forEach(([source, sourceGames]) => {
        const panel = document.createElement('section');
        panel.className = 'source-panel';

        const title = document.createElement('h2');
        title.className = 'source-title';
        title.textContent = source;

        const rows = document.createElement('div');
        rows.className = 'source-games';

        sourceGames.forEach(game => {
          const row = document.createElement('div');
          row.className = 'game-item';

          const info = document.createElement('div');
          info.className = 'game-info';

          const name = document.createElement('div');
          name.className = 'game-name';
          name.textContent = game.match_name || 'Unknown match';

          const gameStatus = document.createElement('div');
          gameStatus.className = 'game-status';
          gameStatus.textContent = game.status || 'Unknown status';

          info.append(name, gameStatus);

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'watch-button';

          const matchUrl = getMatchLink(game);
          const isStarted = String(game.status || '').trim().toLowerCase() === 'started';
          if (!isStarted || !matchUrl) {
            button.disabled = true;
            button.textContent = isStarted ? 'Watch' : (game.status || 'Waiting');
          } else {
            button.textContent = 'Watch';
            button.addEventListener('click', () => {
              window.location.href = '/game.html?url=' + encodeURIComponent(matchUrl);
            });
          }

          row.append(info, button);
          rows.appendChild(row);
        });

        panel.append(title, rows);
        gameList.appendChild(panel);
      });
    }

    async function loadGames(forceRefresh = false) {
      const cachedGames = forceRefresh ? null : readGamesCache();
      if (cachedGames !== null) {
        renderGames(cachedGames);
        setLoading(false);
        return;
      }

      setLoading(true);
      setStatus('');
      try {
        const response = await fetch('/games');
        const data = await response.text();
        let games = [];
        try {
          games = data ? JSON.parse(data) : [];
        } catch {
          throw new Error('Invalid JSON returned by /games.');
        }

        if (!response.ok) {
          const error = Array.isArray(games) ? 'Unable to load matches.' : (games.error || 'Unable to load matches.');
          throw new Error(error);
        }

        const gameListData = Array.isArray(games) ? games : [];
        writeGamesCache(gameListData);
        renderGames(gameListData);
      } catch (error) {
        setStatus(error.message || 'Failed to load matches.', true);
      } finally {
        setLoading(false);
      }
    }

    refreshButton.addEventListener('click', () => loadGames(true));
    loadGames();
  </script>
</body>
</html>
