<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xBiteTV</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", sans-serif;
      --background: #101722;
      --surface: #1c2837;
      --surface-hover: #26364a;
      --line: #394a60;
      --text: #edf2f7;
      --muted: #a9b5c5;
      --accent: #d7f36a;
      --accent-text: #19200e;
      --alert: #ff8875;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background-color: var(--background);
      background-image: linear-gradient(128deg, #071a34 0%, #17326f 48%, #9428e8 100%);
      background-attachment: fixed;
    }
    main { width: min(96vw, 1840px); margin: 48px auto 64px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 38px; }
    h1 { margin: 0; font-size: 2.5rem; line-height: 1; font-weight: 700; }
    #refresh-button {
      min-height: 54px;
      padding: 0 22px;
      border: 0;
      border-radius: 5px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease;
    }
    #refresh-button:hover:not(:disabled) { background: #e5ff83; transform: translateY(-1px); }
    #refresh-button:disabled { opacity: 0.6; cursor: wait; }
    #games-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; gap: 20px; }
    .game-card {
      display: block;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .game-card.is-watchable { cursor: pointer; }
    .game-card.is-watchable:hover { border-color: var(--accent); background: var(--surface-hover); }
    .game-card:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .game-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 42px;
      padding: 8px 12px;
      background: #263547;
    }
    .league-tag, .game-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 50%;
      min-height: 25px;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 0.75rem;
      line-height: 1.2;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .league-tag { background: #d7f36a; color: #19200e; }
    .game-status-pill { justify-content: flex-end; background: #34445a; color: var(--muted); text-align: right; }
    .game-status-pill::before { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: currentColor; content: ""; }
    .game-status-pill.is-started { background: #492d2d; color: #ffad9e; }
    .game-card-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 126px;
      padding: 20px 12px 14px;
    }
    .team-column { min-width: 0; text-align: center; }
    .team-name { margin: 0; font-size: 1rem; line-height: 1.3; font-weight: 800; overflow-wrap: anywhere; }
    .vs-column { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .vs-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #34445a;
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 900;
    }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .empty { grid-column: 1 / -1; color: var(--muted); padding: 24px 0; font-size: 1.2rem; }
    .error { color: var(--alert); }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 12, 20, 0.84);
      z-index: 1000;
    }
    #loading-overlay[hidden] { display: none; }
    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 30px 38px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 1.2rem;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { min-height: 1.5em; margin-top: 20px; color: var(--muted); font-size: 1rem; }
    #status:empty { display: none; }
    @media (max-width: 1280px) {
      #games-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      #games-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      main { width: min(92vw, 560px); margin: 28px auto 40px; }
      .page-header { align-items: flex-start; margin-bottom: 28px; }
      h1 { font-size: 2rem; }
      #refresh-button { min-height: 48px; padding: 0 14px; font-size: 0.95rem; }
      #games-list { grid-template-columns: minmax(0, 1fr); }
      .game-card-body { grid-template-columns: minmax(0, 1fr) 46px minmax(0, 1fr); gap: 5px; min-height: 112px; padding: 16px 8px 12px; }
      .team-name { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div id="loading-overlay" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <div>Loading matches...</div>
    </div>
  </div>
  <main>
    <header class="page-header">
      <h1>xBiteTV</h1>
      <button id="refresh-button" type="button">Refresh matches</button>
    </header>
    <section id="games-list" aria-live="polite"></section>
    <p id="status" role="status"></p>
  </main>
  <script>
    const gameList = document.querySelector('#games-list');
    const status = document.querySelector('#status');
    const loadingOverlay = document.querySelector('#loading-overlay');
    const refreshButton = document.querySelector('#refresh-button');
    const GAMES_CACHE_KEY = 'xbiteTV.games.v1';
    const GAMES_CACHE_TTL_MS = 30 * 60 * 1000;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function getMatchLink(game) {
      return game.link || game.url || game.match_url || '';
    }

    function setLoading(isLoading) {
      loadingOverlay.hidden = !isLoading;
      refreshButton.disabled = isLoading;
    }

    function readGamesCache() {
      try {
        const cached = JSON.parse(localStorage.getItem(GAMES_CACHE_KEY));
        if (!cached || !Array.isArray(cached.games) || !Number.isFinite(cached.savedAt)) {
          localStorage.removeItem(GAMES_CACHE_KEY);
          return null;
        }
        if (Date.now() - cached.savedAt >= GAMES_CACHE_TTL_MS || cached.savedAt > Date.now()) {
          localStorage.removeItem(GAMES_CACHE_KEY);
          return null;
        }
        return cached.games;
      } catch {
        return null;
      }
    }

    function writeGamesCache(games) {
      try {
        localStorage.setItem(GAMES_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), games }));
      } catch {
        // Storage may be disabled or full; continue without caching.
      }
    }

    function renderGames(games) {
      gameList.replaceChildren();

      if (!games.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No matches available right now.';
        gameList.appendChild(empty);
        return;
      }

      games.forEach(game => {
          const source = game.source_prefix || game.source_web || 'Other';
          const matchUrl = getMatchLink(game);
          const isStarted = String(game.status || '').trim().toLowerCase() === 'started';
          const isWatchable = isStarted && Boolean(matchUrl);
          const card = document.createElement(isWatchable ? 'a' : 'article');
          card.className = 'game-card' + (isWatchable ? ' is-watchable' : '');
          if (isWatchable) {
            card.href = '/game.html?url=' + encodeURIComponent(matchUrl);
            card.setAttribute('aria-label', 'Watch ' + (game.match_name || 'match'));
          }

          const cardTop = document.createElement('div');
          cardTop.className = 'game-card-top';

          const league = document.createElement('span');
          league.className = 'league-tag';
          league.textContent = source;

          const gameStatus = document.createElement('span');
          gameStatus.className = 'game-status-pill' + (isStarted ? ' is-started' : '');
          gameStatus.textContent = game.status || 'Unknown status';
          cardTop.append(league, gameStatus);

          const teams = String(game.match_name || 'Unknown match').split(/\s+vs\.?\s+/i);
          const cardBody = document.createElement('div');
          cardBody.className = 'game-card-body';

          const homeTeam = document.createElement('div');
          homeTeam.className = 'team-column';
          const homeName = document.createElement('h3');
          homeName.className = 'team-name';
          homeName.textContent = teams[0] || 'Unknown match';
          homeTeam.appendChild(homeName);

          const vsColumn = document.createElement('div');
          vsColumn.className = 'vs-column';
          const vsBadge = document.createElement('span');
          vsBadge.className = 'vs-badge';
          vsBadge.textContent = 'VS';
          vsColumn.appendChild(vsBadge);

          const awayTeam = document.createElement('div');
          awayTeam.className = 'team-column';
          const awayName = document.createElement('h3');
          awayName.className = 'team-name';
          awayName.textContent = teams.length > 1 ? teams.slice(1).join(' vs ') : 'Match';
          awayTeam.appendChild(awayName);
          cardBody.append(homeTeam, vsColumn, awayTeam);

          card.append(cardTop, cardBody);
          gameList.appendChild(card);
      });
    }

    async function loadGames(forceRefresh = false) {
      const cachedGames = forceRefresh ? null : readGamesCache();
      if (cachedGames !== null) {
        renderGames(cachedGames);
        setLoading(false);
        return;
      }

      setLoading(true);
      setStatus('');
      try {
        const response = await fetch('/games');
        const data = await response.text();
        let games = [];
        try {
          games = data ? JSON.parse(data) : [];
        } catch {
          throw new Error('Invalid JSON returned by /games.');
        }

        if (!response.ok) {
          const error = Array.isArray(games) ? 'Unable to load matches.' : (games.error || 'Unable to load matches.');
          throw new Error(error);
        }

        const gameListData = Array.isArray(games) ? games : [];
        writeGamesCache(gameListData);
        renderGames(gameListData);
      } catch (error) {
        setStatus(error.message || 'Failed to load matches.', true);
      } finally {
        setLoading(false);
      }
    }

    refreshButton.addEventListener('click', () => loadGames(true));
    loadGames();
  </script>
</body>
</html>
